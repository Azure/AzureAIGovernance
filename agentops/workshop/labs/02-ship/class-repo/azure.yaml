# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

# Ship class repository. Each participant replaces ALIAS with their own alias
# on their branch. Both agents run the same help desk code in src/helpdesk:
# the pipeline evaluates the test agent first and deploys the released agent
# only after a person approves the production environment.

requiredVersions:
    azd: '>=1.37.0'
    extensions:
        azure.ai.agents: '1.0.0-beta.23'
name: agentops-ship-class
services:
    ai-project:
        host: azure.ai.project
    helpdesk-ALIAS-test:
        project: src/helpdesk
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            HELPDESK_VARIANT: candidate
            OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: "true"
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: Help desk agent under test before release.
        kind: hosted
        name: helpdesk-ALIAS-test
        protocols:
            - protocol: responses
              version: 2.0.0
    helpdesk-ALIAS:
        project: src/helpdesk
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            HELPDESK_VARIANT: candidate
            OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: "true"
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: Released help desk agent.
        kind: hosted
        name: helpdesk-ALIAS
        protocols:
            - protocol: responses
              version: 2.0.0
infra:
    provider: microsoft.foundry
