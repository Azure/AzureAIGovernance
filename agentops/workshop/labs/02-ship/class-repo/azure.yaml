# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

# Ship class repository. Each participant replaces ALIAS with their own alias
# on their branch. One agent identity holds the stable production version and
# every candidate version. The endpoint selector stays pinned to the current
# production version until evaluation and approval complete.

requiredVersions:
    azd: '>=1.37.0'
    extensions:
        azure.ai.agents: '1.0.0-beta.23'
name: agentops-ship-class
services:
    ai-project:
        host: azure.ai.project
    helpdesk-ALIAS:
        project: src/helpdesk
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            HELPDESK_VARIANT: candidate
            OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: "true"
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: Versioned help desk agent with a pinned production endpoint.
        kind: hosted
        name: helpdesk-ALIAS
        agentEndpoint:
            versionSelector:
                versionSelectionRules:
                    - type: FixedRatio
                      agentVersion: "PRODUCTION_VERSION"
                      trafficPercentage: 100
        protocols:
            - protocol: responses
              version: 2.0.0
infra:
    provider: microsoft.foundry
