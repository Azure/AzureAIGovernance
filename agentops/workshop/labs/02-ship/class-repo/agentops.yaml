# Ship class repository. The instructor replaces FOUNDRY_ENDPOINT once when
# copying the seed; each participant replaces ALIAS on their branch.
# The pipeline sets AGENTOPS_AGENT to the version number it just deployed, and
# the AgentOps Accelerator CLI puts that number in place of the 1 below.
version: 1
agent: FOUNDRY_ENDPOINT/agents/helpdesk-ALIAS/versions/1
dataset: turns.jsonl
protocol: responses
execution: cloud
dataset_sync:
  mode: inline
evaluators:
  - CoherenceEvaluator
  - SimilarityEvaluator
thresholds:
  coherence: ">=3"
  similarity: ">=3"